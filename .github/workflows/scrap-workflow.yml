name: Check diff

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 2'

jobs:
  check:
    runs-on: ubuntu-26.04

    outputs:
      release: ${{ steps.chrome.outputs.release }}

    steps:
      - id: chrome
        run: |
          echo "release=$(curl -fsS 'https://chromiumdash.appspot.com/fetch_milestone_schedule?offset=-1&n=4' \
          | jq --arg d "$(date -u +%F)" 'any(.mstones[]; .stable_date // "" | startswith($d))')" >> "$GITHUB_OUTPUT"

  run-scrap:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Scrap
        run: pnpm scrap

      - name: Commit changes
        run: |
          git add -A snapshots-mv3 snapshots-mv2
          if git diff --cached --quiet; then exit 0; fi

          # Snapshot paths mirror the docs URLs
          DOCS=https://developer.chrome.com/docs/extensions
          MV3=$(git diff --cached --no-renames --name-only -- snapshots-mv3 | sed -E "s#^snapshots-mv3/(.*)\.md\$#$DOCS/reference/\1#")
          MV2=$(git diff --cached --no-renames --name-only -- snapshots-mv2 | sed -E "s#^snapshots-mv2/(api/)?(.*)\.md\$#$DOCS/mv2/reference/\2#; s#/index\$##")
          COUNT=$(git diff --cached --no-renames --name-only | wc -l)
          BODY=""
          [ -z "$MV3" ] || BODY="MV3:"$'\n'"$MV3"$'\n\n'
          [ -z "$MV2" ] || BODY+="MV2:"$'\n'"$MV2"

          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore(scrap): update $COUNT snapshots" -m "$BODY"
          git push
